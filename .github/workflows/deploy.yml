name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: 46.101.183.111
          port: 2222
          username: duck
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/portfolio
            git pull origin main
            docker build -t portfolio:latest .
            docker compose down
            docker compose up -d
            docker image prune -f